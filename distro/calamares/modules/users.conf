---
defaultGroups:
    - name: sudo
      must_exist: true
    - adm
    - cdrom
    - dip
    - plugdev
    - lpadmin
    - video
    - render
    - input
    - audio
    - netdev
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: true
passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
  forbidden_names: [ root, greeter ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "ayazos-${cpu}"
