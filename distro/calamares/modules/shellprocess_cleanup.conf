---
dontChroot: false
timeout: 900
script:
  - command: "apt-get purge -y -q calamares casper 'live-*' >/dev/null 2>&1 || true"
    timeout: 600
  - "rm -f /usr/share/applications/install-ayazos.desktop"
  - "cp /usr/share/ayazos/greetd-config.toml /etc/greetd/config.toml"
  - "rm -f /etc/sudoers.d/casper /etc/casper.conf"
  - "systemctl enable greetd.service"
