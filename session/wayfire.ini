# AyazOS Wayfire yapılandırması

[core]
plugins = alpha animate autostart blur command decoration expo extra-animations ayaz-effects fast-switcher foreign-toplevel grid gtk-shell idle ipc ipc-rules move place resize scale session-lock shortcuts-inhibit switcher vswipe vswitch wayfire-shell window-rules wm-actions wobbly wsets xdg-activation
close_top_view = <super> KEY_Q | <alt> KEY_F4
vwidth = 3
vheight = 1
xwayland = true
preferred_decoration_mode = client
background_color = \#0A0E15FF
focus_button_with_modifier = false

[input]
xkb_layout = tr
kb_repeat_delay = 280
kb_repeat_rate = 40
natural_scroll = false
tap_to_click = true
cursor_theme = default
cursor_size = 24

[decoration]
title_height = 30
border_size = 1
active_color = \#121822F5
inactive_color = \#10141CF2
font = Inter Medium
font_color = \#E8EDF5FF
button_order = minimize maximize close

[animate]
open_animation = rise
close_animation = shatter
minimize_animation = dock
duration = 260ms circle
startup_duration = 600ms
enabled_for = (type equals "toplevel" | (type equals "x-or" & focusable equals true))
fade_enabled_for = type equals "overlay"
zoom_enabled_for = none

[extra-animations]
shatter_duration = 620ms linear

[ayaz-effects]
dock_duration = 400ms sigmoid
rise_duration = 240ms circle
dock_margin = 72

[wobbly]
friction = 3.0
spring_k = 8.0
grid_resolution = 6

[blur]
method = kawase
kawase_iterations = 2
kawase_offset = 1.7
kawase_degrade = 3
blur_by_default = app_id contains "ayaz" | app_id is "net.yazify.VeloneonNotes"
toggle = none

[move]
activate = <super> BTN_LEFT
enable_snap = true
snap_threshold = 12
quarter_snap_threshold = 48

[resize]
activate = <super> BTN_RIGHT

[grid]
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_c = <super> KEY_UP
restore = <super> KEY_DOWN
duration = 260ms circle

[wm-actions]
minimize = <super> KEY_H
toggle_fullscreen = <super> KEY_F

[scale]
toggle = <super> KEY_TAB
duration = 320ms circle
spacing = 40
middle_click_close = true
inactive_alpha = 0.7

[expo]
toggle = <super> KEY_W
duration = 320ms circle

[vswitch]
binding_left = <super> <ctrl> KEY_LEFT
binding_right = <super> <ctrl> KEY_RIGHT
duration = 300ms circle
gap = 24

[vswipe]
enable_horizontal = true
enable_vertical = false
fingers = 3

[fast-switcher]
activate = <alt> KEY_TAB

[switcher]
next_view = <super> <shift> KEY_TAB

[command]
binding_launcher = <super>
command_launcher = qs -c ayazos ipc call launcher toggle
binding_terminal = <super> KEY_ENTER
command_terminal = ayaz-terminal
binding_files = <super> KEY_E
command_files = ayaz-files
binding_lock = <super> KEY_L
command_lock = qs -c ayazos ipc call lock lock
binding_shot = KEY_SYSRQ
command_shot = ayaz-screenshot
repeatable_binding_volup = KEY_VOLUMEUP
command_volup = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
repeatable_binding_voldown = KEY_VOLUMEDOWN
command_voldown = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binding_mute = KEY_MUTE
command_mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
repeatable_binding_light_up = KEY_BRIGHTNESSUP
command_light_up = brightnessctl -q set +5%
repeatable_binding_light_down = KEY_BRIGHTNESSDOWN
command_light_down = brightnessctl -q set 5%-

[idle]
dpms_timeout = 600
screensaver_timeout = -1

[autostart]
autostart_wf_shell = false
0_env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
shell = ayazos-shell
idle = swayidle -w timeout 300 'qs -c ayazos ipc call lock lock' before-sleep 'qs -c ayazos ipc call lock lock'
portal = /usr/libexec/xdg-desktop-portal-wlr


[window-rules]
